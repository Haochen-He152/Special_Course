seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  # Use one combined model configuration for policy/value definitions.
  separate: False
  policy:  # see gaussian_model parameters
    # Policy network: maps observations to a Gaussian action distribution for continuous control.
    class: GaussianMixin
    clip_actions: False
    # Limit the learned action standard deviation to avoid either no exploration or unstable exploration.
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        # MLP hidden layers. This is larger than the original lift example for the multi-object task.
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    # Value network: estimates the expected future return from the current observation.
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        # Keep the value network capacity aligned with the policy network.
        layers: [512, 256, 128]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  # -1 lets skrl size the rollout memory automatically from agent:rollouts.
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  # Number of steps collected per environment before each PPO update.
  rollouts: 32
  # Number of optimization passes over each collected rollout batch.
  learning_epochs: 5
  # Number of mini-batches used within each learning epoch.
  mini_batches: 4
  # Reward discount factor. Higher values make the policy care more about future rewards.
  discount_factor: 0.99
  # GAE parameter for advantage estimation. 0.95 is a common stability/variance tradeoff.
  lambda: 0.95
  # Conservative learning rate for the harder randomized multi-object task.
  learning_rate: 1.0e-04
  # Adapt the learning rate based on policy KL divergence to keep PPO updates stable.
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  # Normalize observations online for more stable training.
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  # Normalize value targets online for more stable critic learning.
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  # PPO starts learning immediately from the first collected rollout.
  random_timesteps: 0
  learning_starts: 0
  # Clip gradient norm to avoid overly large parameter updates.
  grad_norm_clip: 1.0
  # PPO policy/value clipping ranges.
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  # Entropy bonus encourages exploration, useful when the target object is randomized.
  entropy_loss_scale: 0.001
  # Weight of critic/value loss relative to policy loss.
  value_loss_scale: 2.0
  kl_threshold: 0.0
  # Scale environment rewards before optimization.
  rewards_shaper_scale: 0.01
  # Do not bootstrap value estimates on time-limit terminations.
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    # Directory under logs/skrl where runs and checkpoints will be saved.
    directory: "/root/autodl-tmp/IsaacLab/github/Special_Course/lift_final/logs/skrl"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  # Total environment interaction steps. This is a first-stage value; successful runs may need 1M+ steps.
  timesteps: 300000
  environment_info: log
